<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{DESCRIPTION}}">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="website">
{{OG_IMAGE}}
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='2' fill='%23b4531f'/><rect x='4' y='3' width='8' height='10' rx='1' fill='%23fbfaf8'/></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<main class="strip">

  <section class="pane pane--intro">
    <header>
      <h1 class="wordmark">{{WORDMARK}}</h1>
    </header>
    <div class="intro">
      {{INTRO}}
      {{LINKS}}
    </div>
    <p class="hint" aria-hidden="true">
      <span>Scroll sideways</span> <kbd>&larr;</kbd><kbd>&rarr;</kbd>
    </p>
  </section>

  {{PHOTOS}}

  <section class="pane pane--end">
    <p>{{COUNT}}</p>
    <p>{{FOOTER}}</p>
  </section>

</main>

<div class="progress" aria-hidden="true"><span></span></div>

<div class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <button class="lightbox__close" type="button" aria-label="Close">&times;</button>
  <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Previous photo">&#8249;</button>
  <img alt="">
  <p class="caption"></p>
  <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Next photo">&#8250;</button>
</div>

<script src="assets/app.js" defer></script>
</body>
</html>
